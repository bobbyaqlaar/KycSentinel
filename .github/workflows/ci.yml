name: "KYC Sentinel CI"

# Tenant CI in the shape of the framework's ci-python-fastapi.yml template:
# unit tests + F-scenario drivers offline (fake gateway), then the
# framework's security harness strict against THIS repo's .agent-rfc/security.
# Eval gates run at the end: adversarial always, and scorecard / fairness /
# hallucination whenever the judge route's credential is present (see the
# comment above those steps). Secrets per OPERATIONS.md "GitHub Actions
# secrets"; rollout log in DEVLOG.md.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. The v1.2.0 pin commit landed on main and GitHub never
  # dispatched a run for it; with no workflow_dispatch the only recovery
  # was an empty commit. cd-staging.yml already had this.
  workflow_dispatch:
    inputs:
      judged_suites:
        description: "Judged suite to run (free tier affords ~20 judge calls/day)"
        type: choice
        default: golden
        options: [golden, fairness, hallucination, none]
  # The judged suites are split across triggers because they do not all fit in
  # one day's judge quota. Gemini's free tier allows 20 requests/day and the
  # three suites need 22 (golden 12, fairness 4, hallucination 6) — so a run
  # that tried all three exhausted the allowance partway through the last one
  # and went red on an infrastructure error, not a quality result.
  #
  # No gate is removed or loosened; each just runs less often. Golden gates
  # every push. Fairness and hallucination alternate days so that the heaviest
  # day (a push plus hallucination) is 18 calls, still inside the cap:
  #
  #     Mon/Wed/Fri  fairness       4  + one push's golden 12 = 16
  #     Tue/Thu      hallucination  6  + one push's golden 12 = 18
  #
  # 08:30 UTC is just after the free tier's midnight-Pacific reset, so the
  # scheduled run draws from a fresh allowance rather than the previous day's
  # remainder. Which suite runs is keyed off `github.event.schedule` below.
  #
  # Residual limit worth knowing: at 12 calls per golden run, the free tier
  # affords ONE graded push per day. A second push the same day will error on
  # quota. That is a property of the cap, not of these gates.
  schedule:
    - cron: "30 8 * * 1,3,5"   # fairness
    - cron: "30 8 * * 2,4"     # hallucination

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KYC_FAKE_LLM: "1"
      ENVIRONMENT: development
      AGENTSMITH_DIR: ${{ github.workspace }}/AgenticFramework
    steps:
      - uses: actions/checkout@v4
        with:
          path: KYC_Sentinel
      - name: "Checkout AgentSmith framework"
        uses: actions/checkout@v4
        with:
          repository: bobbyaqlaar/AgentSmith   # adjust if the framework repo name differs
          path: AgenticFramework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install deps"
        working-directory: KYC_Sentinel
        run: |
          pip install -r requirements.txt
          # The framework is a real dependency (framework G6) — installed from
          # the checkout above rather than bootstrapped onto sys.path. Against
          # a published version this becomes a pinned line in requirements.txt.
          pip install -e "$AGENTSMITH_DIR"
      - name: "py_compile sweep"
        working-directory: KYC_Sentinel
        run: find agents workflows test -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile
      - name: "Vendored composite actions match the framework"
        # .github/actions/gcp-auth is a verbatim copy of the framework's (see
        # DEVLOG 2026-07-22). Nothing kept the two in step, so a fix upstream —
        # the `authenticated` output's string-'false'-is-truthy trap, say —
        # would never reach this repo. The framework checkout is already here,
        # so diffing is free.
        run: |
          diff -r AgenticFramework/.github/actions/gcp-auth \
                  KYC_Sentinel/.github/actions/gcp-auth \
            || { echo "::error::vendored gcp-auth has drifted from the framework's copy — re-vendor it"; exit 1; }
      - name: "Unit tests (fake gateway)"
        working-directory: KYC_Sentinel
        run: python3 -m pytest test/ -q
      - name: "F-scenario drivers"
        working-directory: KYC_Sentinel
        run: python3 demo.py all
      - name: "Security harness (strict) against this tenant"
        working-directory: KYC_Sentinel
        env:
          PROMPT_GUARD: default        # enforcing; `warn` would fail --strict
          # `required` is now satisfiable (framework G10): tenant.yaml declares
          # moderation.hook, so the harness imports and smoke-tests this
          # tenant's own classifier rather than only the framework API.
          MODERATION_HOOK: required
          TOOL_ALLOWLIST_STRICT: "1"
        run: |
          pip install jsonschema
          python3 $AGENTSMITH_DIR/scripts/run-security-checks.py --mode ci --strict
          # Hard-fail as of 2026-07-21: the tenant .agent-rfc/security/ pack
          # (risk register, agency manifest, NIST profile, tool allowlist) is
          # authored, so there is nothing left to excuse with '|| true'.

      # ── Eval gates ───────────────────────────────────────────────────────
      # testbed-tenant-spec.md §3 claims "scorecard + fairness + hallucination
      # + adversarial gates in CI" for this tenant; until now nothing ran them,
      # so a regression that broke pair parity or introduced a hallucinated
      # citation reached main unchallenged.
      #
      # NOT the framework's reusable eval-*.yml workflows: those `run: python3
      # scripts/run-evals.py` against the CALLING repo, and this tenant has no
      # scripts/ of its own — it uses the framework checkout already cloned
      # above, exactly like the security-harness step.
      #
      # Whether the judge is reachable is decided by run-evals.py's
      # `--skip-without-judge-credentials`, NOT by a `if: secrets.X != ''` in
      # this file. The first cut of these steps gated on ANTHROPIC_API_KEY and
      # was wrong twice: it hardcodes a provider (repoint `judge` at Groq or
      # Ollama and the condition is nonsense), and this repo's judge declares
      # `api_key_env: ANTHROPIC_API_KEY_JUDGE` in models.yaml — so the gate was
      # reading a variable the route never uses, and would have stayed skipped
      # even after the declared key was set.
      #
      # The flag asks the merged registry which env var the `judge` role needs
      # and skips with a message naming it. All plausible provider keys are
      # passed through below because YAML cannot look up a secret by a name
      # computed at runtime; the DECISION lives in code that can read
      # models.yaml. Suites with too few cases also skip gracefully (exit 0).
      # THRESHOLD IS CALIBRATED and lives on the `judge` role in models.yaml,
      # not here. It was measured against the grader that produced it
      # (gemini-3-flash-preview, 2026-07-30) and travels with that role, so
      # repointing the judge cannot silently leave a stale number behind.
      # Passing --fail-below here would override it — that is why these steps
      # no longer do. Provenance and the measured numbers: models.yaml.
      - name: "Eval: golden scorecard"
        # Not on the scheduled runs: those exist to carry the other two suites,
        # and adding golden's 12 calls would put the day back over the cap. On a
        # manual run it is opt-in for the same reason — a dispatch that fired all
        # three would be the 22-call run this split exists to prevent.
        if: >-
          github.event_name != 'schedule' &&
          (github.event_name != 'workflow_dispatch' ||
           github.event.inputs.judged_suites == 'golden')
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Free-tier judges cap requests per minute. Unpaced, the suite bursts
          # past the cap, cost_router's 4-attempt retry is exhausted, every case
          # carries an error, and run-evals reports "judge was unreachable" and
          # exits 0 — the gate does not fail, it never grades.
          EVAL_RPM:                 "10"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --skip-without-judge-credentials

      - name: "Eval: fairness pair parity (policy-007)"
        # Mon/Wed/Fri, or on demand. `github.event.schedule` is the cron that
        # fired, which is what lets one workflow carry two different schedules
        # without a second file duplicating the whole checkout and install.
        if: >-
          github.event.schedule == '30 8 * * 1,3,5' ||
          github.event.inputs.judged_suites == 'fairness'
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Free-tier judges cap requests per minute. Unpaced, the suite bursts
          # past the cap, cost_router's 4-attempt retry is exhausted, every case
          # carries an error, and run-evals reports "judge was unreachable" and
          # exits 0 — the gate does not fail, it never grades.
          EVAL_RPM:                 "10"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --suite fairness --skip-without-judge-credentials

      - name: "Eval: hallucination (F7 citation grounding)"
        # Tue/Thu, or on demand.
        if: >-
          github.event.schedule == '30 8 * * 2,4' ||
          github.event.inputs.judged_suites == 'hallucination'
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Free-tier judges cap requests per minute. Unpaced, the suite bursts
          # past the cap, cost_router's 4-attempt retry is exhausted, every case
          # carries an error, and run-evals reports "judge was unreachable" and
          # exits 0 — the gate does not fail, it never grades.
          EVAL_RPM:                 "10"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --suite hallucination --skip-without-judge-credentials

      # Adversarial is deterministic — pattern-matched, no judge model — so it
      # runs unconditionally and is a real gate on every PR, key or no key.
      - name: "Eval: adversarial (F3 prompt injection)"
        working-directory: KYC_Sentinel
        env:
          PROMPT_GUARD: default
        run: python3 $AGENTSMITH_DIR/scripts/run-evals.py --suite adversarial

      - name: "Upload eval results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: KYC_Sentinel/.agent-rfc/fixtures/eval_results.json
          if-no-files-found: ignore
