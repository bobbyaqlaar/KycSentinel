name: "KYC Sentinel CI"

# Tenant CI in the shape of the framework's ci-python-fastapi.yml template:
# unit tests + F-scenario drivers offline (fake gateway), then the
# framework's security harness strict against THIS repo's .agent-rfc/security.
# Eval gates run at the end: adversarial always, and scorecard / fairness /
# hallucination whenever the judge route's credential is present (see the
# comment above those steps). Secrets per OPERATIONS.md "GitHub Actions
# secrets"; rollout log in DEVLOG.md.

on:
  push:
    branches: [main]
  pull_request:
  # 01:00 America/Los_Angeles = 08:00/09:00 UTC, just after the Gemini free
  # tier's daily quota resets at midnight Pacific. Running the cron suites
  # BEFORE the working day means they grade against a full budget and leave
  # the remainder for that day's pushes, rather than competing with them.
  schedule:
    - cron: "0 9 * * 1,3,5"   # fairness       (4 judge calls)
    - cron: "0 9 * * 2,4,6"   # hallucination  (6 judge calls)
  # Manual re-run. The v1.2.0 pin commit landed on main and GitHub never
  # dispatched a run for it; with no workflow_dispatch the only recovery
  # was an empty commit. cd-staging.yml already had this.
  workflow_dispatch:
    inputs:
      judged_suites:
        description: "Which judged suites to run"
        type: choice
        default: all
        options: [all, golden, fairness, hallucination, none]

# WHICH JUDGED SUITES RUN WHEN, and why it is not "all of them, every push".
#
#   push / PR       golden          12 judge calls — unless the change is
#                                   documentation only, see "Scope" below
#   Mon/Wed/Fri     fairness         4
#   Tue/Thu/Sat     hallucination    6
#
# The judge is gemini-3-flash-preview on a free tier that allows **20 requests
# per day, per project, per model**. All three suites together need 22. Running
# them on every push was restored on 2026-08-19 on the strength of a note
# saying the quota constraint "no longer binds" because a full 22-call cycle
# had completed once when paced at EVAL_RPM=12.
#
# That reasoning conflated two different limits. Pacing governs calls per
# MINUTE; the 20 is per DAY, and no rate stretches 22 into 20. Re-measured
# 2026-08-23 against the live endpoint:
#
#     429 RESOURCE_EXHAUSTED
#     quotaId: GenerateRequestsPerDayPerProjectPerModel-FreeTier
#     quotaValue: 20   model: gemini-3-flash
#
# The failure mode is the reason this matters more than the latency it costs.
# An over-quota suite does not go red — every case errors, run-evals reports
# NO VERDICT and exits 0, and the check is GREEN. So "all three on every push"
# does not fail loudly on the second push of a day; it silently stops grading
# anything, and a green tick means the suites did not run rather than that they
# passed. Splitting them keeps a day's worst case at 12 + 6 = 18 of 20.
#
# Two pushes in one day still exceed it — unavoidable on this tier. What
# changed is that it is now VISIBLE: run-evals emits a GitHub warning
# annotation and a job-summary block whenever a gate was asked to grade and
# could not, so an ungraded gate is legible on a green run instead of silent.
#
# If EVAL_RPM is wrong you get the same NO VERDICT for a different reason —
# check pacing before assuming the daily quota, and the annotation before
# assuming either.
#
# workflow_dispatch keeps the per-suite input, for re-running one suite against
# a fixture change without paying for the other two.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KYC_FAKE_LLM: "1"
      ENVIRONMENT: development
      AGENTSMITH_DIR: ${{ github.workspace }}/AgenticFramework
    steps:
      - uses: actions/checkout@v4
        with:
          path: KYC_Sentinel
      - name: "Checkout AgentSmith framework"
        uses: actions/checkout@v4
        with:
          repository: bobbyaqlaar/AgentSmith   # adjust if the framework repo name differs
          path: AgenticFramework
      # Did this change touch anything a judged gate could be affected by?
      #
      # The golden suite costs 12 of the judge's 20 daily calls. On 2026-09-01 a
      # README-only commit spent them: golden graded 6 of 12 and took
      # 429 RESOURCE_EXHAUSTED on the rest, and the local run that was queued to
      # grade golden properly had to wait another day for a reset. A prose edit
      # cannot change what the judge would say about the agents' output, so
      # paying a full gate for one is waste that also starves the real thing.
      #
      # Deliberately NOT `paths-ignore:` at the workflow level. That would skip
      # the offline unit tests, the F-scenario drivers and the security harness
      # too, and those genuinely should run on a docs change — a README edit can
      # break the F-table it documents. Only the judged step is gated.
      #
      # FAILS OPEN, and that is the important property. Every path where the
      # changed-file list cannot be determined — a force-push, a new branch
      # whose `before` is all-zeros, a rate-limited API, a shape this does not
      # anticipate — leaves `docs_only` unset, and the gate runs. A gate that
      # quietly stops running because a detection step guessed wrong is the
      # exact failure this repo exists to demonstrate; spending 12 calls we did
      # not need to is the cheaper mistake of the two.
      #
      # The API is used rather than `git diff` because both checkouts above are
      # shallow (depth 1), so there is no local history to diff against.
      - name: "Scope: is this a docs-only change?"
        id: scope
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename') || files="" ;;
            *)
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" \
                --jq '.files[].filename') || files="" ;;
          esac

          if [ -z "$files" ]; then
            echo "::notice::changed-file list unavailable — running the judged gate (fail open)"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$files" | sed 's/^/  /'

          # Any path that is not a .md file makes this a code change. Fixtures
          # under .agent-rfc/ are .json and therefore count as code, which is
          # right: changing what a case says is exactly when golden must re-run.
          if echo "$files" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ code changed; the judged gate will run"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change — SKIPPING the golden gate (12 judge calls). Offline tests, F-scenarios and the security harness still run."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install deps"
        working-directory: KYC_Sentinel
        run: |
          pip install -r requirements.txt
          # The framework is a real dependency (framework G6) — installed from
          # the checkout above rather than bootstrapped onto sys.path. Against
          # a published version this becomes a pinned line in requirements.txt.
          pip install -e "$AGENTSMITH_DIR"
      - name: "py_compile sweep"
        working-directory: KYC_Sentinel
        run: find agents workflows test -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile
      - name: "Vendored composite actions match the framework"
        # .github/actions/gcp-auth is a verbatim copy of the framework's (see
        # DEVLOG 2026-07-22). Nothing kept the two in step, so a fix upstream —
        # the `authenticated` output's string-'false'-is-truthy trap, say —
        # would never reach this repo. The framework checkout is already here,
        # so diffing is free.
        run: |
          diff -r AgenticFramework/.github/actions/gcp-auth \
                  KYC_Sentinel/.github/actions/gcp-auth \
            || { echo "::error::vendored gcp-auth has drifted from the framework's copy — re-vendor it"; exit 1; }
      - name: "Unit tests (fake gateway)"
        working-directory: KYC_Sentinel
        run: python3 -m pytest test/ -q
      - name: "F-scenario drivers"
        working-directory: KYC_Sentinel
        run: python3 demo.py all
      - name: "Security harness (strict) against this tenant"
        working-directory: KYC_Sentinel
        env:
          PROMPT_GUARD: default        # enforcing; `warn` would fail --strict
          # `required` is now satisfiable (framework G10): tenant.yaml declares
          # moderation.hook, so the harness imports and smoke-tests this
          # tenant's own classifier rather than only the framework API.
          MODERATION_HOOK: required
          TOOL_ALLOWLIST_STRICT: "1"
        run: |
          pip install jsonschema
          python3 $AGENTSMITH_DIR/scripts/run-security-checks.py --mode ci --strict
          # Hard-fail as of 2026-07-21: the tenant .agent-rfc/security/ pack
          # (risk register, agency manifest, NIST profile, tool allowlist) is
          # authored, so there is nothing left to excuse with '|| true'.

      # ── Eval gates ───────────────────────────────────────────────────────
      # testbed-tenant-spec.md §3 claims "scorecard + fairness + hallucination
      # + adversarial gates in CI" for this tenant; until now nothing ran them,
      # so a regression that broke pair parity or introduced a hallucinated
      # citation reached main unchallenged.
      #
      # NOT the framework's reusable eval-*.yml workflows: those `run: python3
      # scripts/run-evals.py` against the CALLING repo, and this tenant has no
      # scripts/ of its own — it uses the framework checkout already cloned
      # above, exactly like the security-harness step.
      #
      # Whether the judge is reachable is decided by run-evals.py's
      # `--skip-without-judge-credentials`, NOT by a `if: secrets.X != ''` in
      # this file. The first cut of these steps gated on ANTHROPIC_API_KEY and
      # was wrong twice: it hardcodes a provider (repoint `judge` at Groq or
      # Ollama and the condition is nonsense), and this repo's judge declares
      # `api_key_env: ANTHROPIC_API_KEY_JUDGE` in models.yaml — so the gate was
      # reading a variable the route never uses, and would have stayed skipped
      # even after the declared key was set.
      #
      # The flag asks the merged registry which env var the `judge` role needs
      # and skips with a message naming it. All plausible provider keys are
      # passed through below because YAML cannot look up a secret by a name
      # computed at runtime; the DECISION lives in code that can read
      # models.yaml. Suites with too few cases also skip gracefully (exit 0).
      # THRESHOLD IS CALIBRATED and lives on the `judge` role in models.yaml,
      # not here. It was measured against the grader that produced it
      # (gemini-3-flash-preview, recalibrated 2026-08-19) and travels with that
      # role, so repointing the judge cannot silently leave a stale number
      # behind — a property this repo has now exercised twice, in both
      # directions, and the hallucination bar is still PROVISIONAL because of it.
      # Passing --fail-below here would override it — that is why these steps
      # no longer do. Provenance and the measured numbers: models.yaml.
      # `steps.scope.outputs.docs_only != 'true'` rather than `== 'false'`: the
      # scope step does not run on dispatch, and an unset output must mean RUN.
      # Written the other way round, a skipped detection step would silently
      # disable the gate.
      - name: "Eval: golden scorecard"
        if: >-
          ((github.event_name == 'push' || github.event_name == 'pull_request')
           && steps.scope.outputs.docs_only != 'true')
          || (github.event_name == 'workflow_dispatch'
              && (github.event.inputs.judged_suites == 'all'
                  || github.event.inputs.judged_suites == 'golden'))
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Pacing stays on, and the RATE IS PART OF THE CALIBRATION. A
          # threshold is only valid at the pacing it was measured at: grade
          # faster than the judge tolerates and cases error, and an errored case
          # is not a low score — under the 100%-graded rule one error means the
          # suite cannot pass at all.
          #
          # 12/min because that is what the 2026-08-19 recalibration ran at on
          # gemini-3-flash-preview, completing full 22-call cycles. The previous
          # value of 20 was inherited from the Groq binding ("half the rate that
          # ran 46 calls clean") and did not survive the judge change — it was
          # left pointing at a model that no longer exists.
          #
          # Unpaced or over-paced, this does not go red. run-evals reports
          # "judge was unreachable" and exits 0: the gate does not fail, it never
          # grades. That is the failure this whole file is arranged around.
          EVAL_RPM:                 "12"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --skip-without-judge-credentials

      - name: "Eval: fairness pair parity (policy-007)"
        if: >-
          github.event_name == 'workflow_dispatch'
          && (github.event.inputs.judged_suites == 'all'
              || github.event.inputs.judged_suites == 'fairness')
          || github.event_name == 'schedule'
          && github.event.schedule == '0 9 * * 1,3,5'
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Pacing stays on, and the RATE IS PART OF THE CALIBRATION. A
          # threshold is only valid at the pacing it was measured at: grade
          # faster than the judge tolerates and cases error, and an errored case
          # is not a low score — under the 100%-graded rule one error means the
          # suite cannot pass at all.
          #
          # 12/min because that is what the 2026-08-19 recalibration ran at on
          # gemini-3-flash-preview, completing full 22-call cycles. The previous
          # value of 20 was inherited from the Groq binding ("half the rate that
          # ran 46 calls clean") and did not survive the judge change — it was
          # left pointing at a model that no longer exists.
          #
          # Unpaced or over-paced, this does not go red. run-evals reports
          # "judge was unreachable" and exits 0: the gate does not fail, it never
          # grades. That is the failure this whole file is arranged around.
          EVAL_RPM:                 "12"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --suite fairness --skip-without-judge-credentials

      - name: "Eval: hallucination (F7 citation grounding)"
        if: >-
          github.event_name == 'workflow_dispatch'
          && (github.event.inputs.judged_suites == 'all'
              || github.event.inputs.judged_suites == 'hallucination')
          || github.event_name == 'schedule'
          && github.event.schedule == '0 9 * * 2,4,6'
        working-directory: KYC_Sentinel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_JUDGE:  ${{ secrets.ANTHROPIC_API_KEY_JUDGE }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_OWNER_ID:           ci@kyc-sentinel
          # Pacing stays on, and the RATE IS PART OF THE CALIBRATION. A
          # threshold is only valid at the pacing it was measured at: grade
          # faster than the judge tolerates and cases error, and an errored case
          # is not a low score — under the 100%-graded rule one error means the
          # suite cannot pass at all.
          #
          # 12/min because that is what the 2026-08-19 recalibration ran at on
          # gemini-3-flash-preview, completing full 22-call cycles. The previous
          # value of 20 was inherited from the Groq binding ("half the rate that
          # ran 46 calls clean") and did not survive the judge change — it was
          # left pointing at a model that no longer exists.
          #
          # Unpaced or over-paced, this does not go red. run-evals reports
          # "judge was unreachable" and exits 0: the gate does not fail, it never
          # grades. That is the failure this whole file is arranged around.
          EVAL_RPM:                 "12"
        run: >-
          python3 $AGENTSMITH_DIR/scripts/run-evals.py
          --suite hallucination --skip-without-judge-credentials

      # Adversarial is deterministic — pattern-matched, no judge model — so it
      # runs unconditionally and is a real gate on every PR, key or no key.
      - name: "Eval: adversarial (F3 prompt injection)"
        working-directory: KYC_Sentinel
        env:
          PROMPT_GUARD: default
        run: python3 $AGENTSMITH_DIR/scripts/run-evals.py --suite adversarial

      - name: "Upload eval results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: KYC_Sentinel/.agent-rfc/fixtures/eval_results.json
          if-no-files-found: ignore
