# KYC Sentinel — AgentSmith tenant configuration (SPECS.md §23)
tenant:
  id: kyc-sentinel
  name: "KYC Sentinel (testbed)"
  isolation: dedicated          # exercises runtime/k8s/dedicated-tenant/
  owner: bobbyaqlaar@gmail.com

framework:
  version: "1.2.x"

gateway:
  # Per-agent model routes live in models.yaml's `profiles:` block, not here.
  #
  # routing_overrides used to restate all four roles, which was redundant while
  # models.yaml was flat and became actively harmful once it gained profiles:
  # an override sets ONLY the `id`, leaving `provider`/`endpoint`/cost from
  # whichever profile is active. Selecting `local` therefore produced
  # `id: claude-sonnet-4-6` on `provider: ollama` — a Groq/Anthropic/Google
  # model name pointed at localhost, 404 on every call, from a config that
  # reads as correct. Verified before removing them.
  #
  # It remains available as a genuine SHORTHAND: swapping one role to another
  # model on the SAME provider, without copying a whole registry. A
  # cross-provider change needs a catalog entry and a profile binding, because
  # only those can carry the provider with the id.
  #
  # Multi-LLM is structural here: sovereign-local for PII, cheap cloud for
  # volume, frontier for judgment, independent cross-vendor judge (RFC-002).

moderation:
  # Declared so BOTH the runtime (auto-registers at first use) and the
  # SEC-MOD-001 harness (imports + smoke-tests it) bind to the same
  # classifier — framework G10. Lets this tenant run MODERATION_HOOK=required.
  hook: "agents.moderation:classify_output"

# Security posture — every line is read, and each env var overrides its line.
# Quoted on purpose: YAML 1.1 parses a bare `off` as the boolean false.
security:
  prompt_guard: "default"          # PROMPT_GUARD
  input_guardrail: "default"       # INPUT_GUARDRAIL
  tool_allowlist_strict: true      # TOOL_ALLOWLIST_STRICT — this tenant's
                                   # security pack is graded --strict in CI
  ip_redaction: false              # ENABLE_IP_REDACTION

budget:
  monthly_usd_cap: 5            # deliberately small — F5 degrade demo fires

workflow:
  engine: temporal
  task_queue: kyc-sentinel

hitl:
  # Filled in at deploy time (portal "Replay with edits" → this webhook →
  # runtime/replay_webhook_server.py → temporal_replay signal). F1 path.
  # replay_webhook_url: https://worker.kyc-sentinel.example/replay
  # replay_webhook_secret: <openssl rand -hex 32>

delivery:
  platform: gcp-cloud-run       # delivery-model soft gate satisfied
  data_access_pattern: api-only
